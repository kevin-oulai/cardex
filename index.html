<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="description" content="CARDEX — open boosters, collect 192 real-world cars, trade them and race the daily Showdown.">
  <title>CARDEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffb000'/%3E%3Cpath d='M9 22l5-12h9l-2 4h-5l-1 3h5l-2 5z' fill='%230a0b0e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://svqaunlehadayyyctvuo.supabase.co">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="./assets/css/app.css?v=3">
  <script type="module" src="./assets/js/main.js?v=3"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" hidden>
      <a class="logo" href="#/packs" aria-label="CARDEX home"><span>CAR</span><em>DEX</em></a>
      <div class="wallet" aria-label="Wallet">
        <button class="chip level" data-go="profile" title="Player level">
          <svg viewBox="0 0 36 36" class="ring" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle cx="18" cy="18" r="15" class="ring-fill" id="xpRing"/></svg>
          <b id="levelNum">1</b>
        </button>
        <span class="chip" title="Credits"><i class="coin-dot" aria-hidden="true"></i><b id="credits" class="mono">0</b><span class="sr-only">credits</span></span>
        <span class="chip tickets" title="Booster tickets"><i class="ticket-dot" aria-hidden="true"></i><b id="tickets" class="mono">0</b><small id="ticketTimer" class="mono"></small><span class="sr-only">tickets</span></span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" aria-label="Toggle sound"></button>
        <button class="icon-btn" data-go="community" aria-label="Community" id="communityBtn"></button>
        <div class="inbox-wrap">
          <button class="icon-btn" id="inboxBtn" aria-label="Notifications" aria-expanded="false" aria-controls="inbox"><span class="badge" id="inboxBadge" hidden></span></button>
          <div class="popover" id="inbox" hidden></div>
        </div>
      </div>
    </header>
    <nav class="tabbar" aria-label="Main" hidden>
      <a href="#/packs" data-tab="packs"><span class="tab-ico" data-icon="packs"></span><span>Packs</span></a>
      <a href="#/garage" data-tab="garage"><span class="tab-ico" data-icon="garage"></span><span>Garage</span></a>
      <a href="#/showdown" data-tab="showdown"><span class="tab-ico" data-icon="flag"></span><span>Showdown</span></a>
      <a href="#/market" data-tab="market"><span class="tab-ico" data-icon="market"></span><span>Market</span></a>
      <a href="#/profile" data-tab="profile"><span class="tab-ico" data-icon="user"></span><span>Profile</span></a>
    </nav>
    <main id="view" tabindex="-1">
      <div class="boot"><div class="boot-logo"><span>CAR</span><em>DEX</em></div><div class="boot-bar"><i></i></div></div>
    </main>
    <footer class="legal" hidden>
      <span>Unofficial fan project. Not affiliated with any manufacturer; marks and photos belong to their owners.</span>
      <nav><a href="./legal.html">Legal</a><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms &amp; credits</a></nav>
    </footer>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">CARDEX needs JavaScript.</p></noscript>
</body>
</html>
